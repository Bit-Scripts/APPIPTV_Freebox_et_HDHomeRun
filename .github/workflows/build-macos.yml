name: Build macOS
run-name: Build macOS — ${{ inputs.source_ref || github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Tag or commit to build without moving it'
        required: true
        default: 'v1.5.0'
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-platform.yml
    with:
      runner: macos-latest
      spec_file: specs/main-macos.spec
      output_name: APPIPTV-macOS.dmg
      artifact_name: macos-latest-app
      source_ref: ${{ inputs.source_ref || github.sha }}
