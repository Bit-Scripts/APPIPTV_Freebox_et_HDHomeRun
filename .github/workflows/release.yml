name: Publish release after all OS builds

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      source_ref: ${{ github.sha }}

  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ github.sha }}

  macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      source_ref: ${{ github.sha }}

  release:
    permissions:
      contents: write
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubuntu-latest-app

      - name: Download Windows Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-latest-app

      - name: Download macOS Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-latest-app

      - name: List downloaded files (debugging step)
        run: |
          echo "Files in the current directory:"
          ls -R

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            IPTVAPP — lecteur libmpv intégré à PyQt6/OpenGL.
            Les distributions embarquent libmpv ; aucune installation séparée du lecteur n'est requise.
            Consulter docs/mpv.md pour les dépendances graphiques, le réseau et les tests.

      - name: Save upload URL to environment
        run: echo "UPLOAD_URL=${{ steps.create_release.outputs.upload_url }}" >> $GITHUB_ENV

      - name: Upload Release Asset for Linux
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: APPIPTV-Linux
          asset_name: APPIPTV-Linux
          asset_content_type: application/octet-stream

      - name: Upload Release Asset for Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: APPIPTV-Windows.exe
          asset_name: APPIPTV-Windows.exe
          asset_content_type: application/octet-stream

      - name: Upload Release Asset for macOS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: APPIPTV-macOS.dmg
          asset_name: APPIPTV-macOS.dmg
          asset_content_type: application/octet-stream
