name: Build and Release Application

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            spec_file: specs/main-linux.spec
            output_name: APPIPTV-Linux
          - os: windows-latest
            spec_file: specs/main-windows.spec
            output_name: APPIPTV-Windows.exe
          - os: macos-latest
            spec_file: specs/main-macos.spec
            output_name: APPIPTV-macOS.dmg

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Install libmpv on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 libxcb-cursor0
          echo "IPTV_LIBMPV=$(ldconfig -p | awk '/libmpv.so.2 .*x86-64/ {print $NF; exit}')" >> "$GITHUB_ENV"

      - name: Install shared libmpv on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dll = python specs/fetch_windows_mpv.py --output "$env:RUNNER_TEMP/mpv"
          if ($LASTEXITCODE -ne 0) { throw 'libmpv download/verification failed' }
          "IPTV_LIBMPV=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Split-Path $dll) | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install libmpv and create-dmg on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install mpv create-dmg
          echo "IPTV_LIBMPV=$(brew --prefix mpv)/lib/libmpv.dylib" >> "$GITHUB_ENV"

      - name: Verify native libmpv and packaging helpers
        run: |
          python -s specs/smoke_libmpv.py
          python -s -m unittest discover -s tests -p test_mpv_distribution.py -v
          python -s -m unittest discover -s tests -p test_windows_mpv.py -v

      - name: Build with PyInstaller using spec file
        run: |
          pyinstaller ${{ matrix.spec_file }}

      - name: Verify bundled native libraries and Qt platform plugin
        run: python -s specs/verify_bundle.py dist/APPIPTV
        if: matrix.os == 'ubuntu-latest'

      - name: Verify Windows bundle
        run: python -s specs/verify_bundle.py dist/APPIPTV.exe
        if: matrix.os == 'windows-latest'

      - name: Verify macOS bundle
        run: python -s specs/verify_bundle.py dist/APPIPTV.app
        if: matrix.os == 'macos-latest'

      - name: Rename output files (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv dist/APPIPTV dist/${{ matrix.output_name }}

      - name: Rename output files (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv dist/APPIPTV.exe dist/${{ matrix.output_name }}

      - name: Create DMG file (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          create-dmg \
            --volname "APPIPTV-macOS" \
            --volicon "assets/image/APPIPTVdmgicon.icns" \
            --background "assets/image/APPIPTV-Background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "APPIPTV.app" 100 150 \
            --app-drop-link 500 150 \
            "dist/${{ matrix.output_name }}" \
            "dist/APPIPTV.app"

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-app
          path: dist/${{ matrix.output_name }}
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubuntu-latest-app

      - name: Download Windows Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-latest-app

      - name: Download macOS Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-latest-app

      - name: List downloaded files (debugging step)
        run: |
          echo "Files in the current directory:"
          ls -R

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            IPTVAPP — lecteur libmpv intégré à PyQt6/OpenGL.
            Les distributions embarquent libmpv ; aucune installation séparée du lecteur n'est requise.
            Consulter docs/mpv.md pour les dépendances graphiques, le réseau et les tests.

      - name: Save upload URL to environment
        run: echo "UPLOAD_URL=${{ steps.create_release.outputs.upload_url }}" >> $GITHUB_ENV

      - name: Upload Release Asset for Linux
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: APPIPTV-Linux
          asset_name: APPIPTV-Linux
          asset_content_type: application/octet-stream

      - name: Upload Release Asset for Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: APPIPTV-Windows.exe
          asset_name: APPIPTV-Windows.exe
          asset_content_type: application/octet-stream

      - name: Upload Release Asset for macOS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: APPIPTV-macOS.dmg
          asset_name: APPIPTV-macOS.dmg
          asset_content_type: application/octet-stream
